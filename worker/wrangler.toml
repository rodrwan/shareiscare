name = "shareiscare"
main = "src/worker.js"
compatibility_date = "2024-03-01"

[durable_objects]
bindings = [
  { name = "TUNNEL", class_name = "TunnelDO" }
]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TunnelDO"]

[vars]
MAX_TUNNELS = "50"
MAX_REQUEST_BODY_MB = "100"
RATE_LIMIT_RPM = "60"
CLEANUP_HOURS = "24"

[[routes]]
pattern = "*.shareiscare.dev/*"
zone_name = "shareiscare.dev"
